<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TCP Chat Room</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Clash+Display:wght@500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #08090a;
  --surface:  #111214;
  --surface2: #16181b;
  --border:   #1f2023;
  --accent:   #4fffb0;
  --accent2:  #7b6cff;
  --danger:   #ff6b6b;
  --text:     #e2e4e9;
  --muted:    #555861;
  --own-bg:   #0d2119;
  --own-bdr:  rgba(79,255,176,0.18);
  --dm-bg:    #13112a;
  --dm-bdr:   rgba(123,108,255,0.25);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 20px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-box {
  width: 34px; height: 34px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.logo-name { font-size: 15px; font-weight: 700; }
.logo-name span { color: var(--accent); }

.section-label {
  padding: 16px 18px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

#user-list {
  list-style: none;
  padding: 0 8px;
  flex: 1;
  overflow-y: auto;
}

#user-list::-webkit-scrollbar { width: 3px; }
#user-list::-webkit-scrollbar-thumb { background: var(--border); }

#user-list li {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
  color: var(--text);
}

#user-list li:hover { background: var(--surface2); }
#user-list li.dm-active { background: var(--dm-bg); color: var(--accent2); }

.udot {
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 6px var(--accent);
}

.you-tag {
  margin-left: auto;
  font-size: 9px;
  background: var(--border);
  color: var(--muted);
  padding: 2px 5px;
  border-radius: 4px;
}

.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
}

.my-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.my-nick  { font-size: 14px; font-weight: 700; color: var(--accent); }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.chat-header {
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chat-title { font-size: 16px; font-weight: 700; }
.chat-title span { color: var(--accent); }

.live-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface2);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

.live-dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--accent); }
  50%       { opacity: 0.3; box-shadow: none; }
}

.dm-banner {
  display: none;
  padding: 7px 22px;
  background: rgba(123,108,255,0.06);
  border-bottom: 1px solid var(--dm-bdr);
  font-size: 12px;
  color: var(--accent2);
  align-items: center;
  gap: 10px;
}

.dm-banner.show { display: flex; }

.dm-banner button {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 15px;
  line-height: 1;
}

.dm-banner button:hover { color: var(--danger); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-behavior: smooth;
}

#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 68%;
  padding: 9px 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.55;
  word-break: break-word;
  animation: pop 0.18s cubic-bezier(0.16,1,0.3,1) both;
}

@keyframes pop {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-own {
  align-self: flex-end;
  background: var(--own-bg);
  border: 1px solid var(--own-bdr);
  border-bottom-right-radius: 3px;
}

.msg-other {
  align-self: flex-start;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
}

.msg-dm {
  align-self: flex-start;
  background: var(--dm-bg);
  border: 1px solid var(--dm-bdr);
  border-bottom-left-radius: 3px;
  color: #c4beff;
}

.msg-dm.sent {
  align-self: flex-end;
  border-bottom-right-radius: 3px;
  border-bottom-left-radius: 12px;
}

.msg-notif {
  align-self: center;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  padding: 3px 12px;
  border-radius: 20px;
  max-width: 100%;
}

.input-row {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  gap: 10px;
  align-items: center;
}

#msg-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

#msg-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,255,176,0.07);
}

#msg-input::placeholder { color: var(--muted); }

.send-btn {
  width: 42px; height: 42px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
  font-weight: 700;
}

.send-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(79,255,176,0.25);
}

.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 99;
  align-items: center;
  justify-content: center;
}

.overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 44px 36px;
  text-align: center;
  max-width: 340px;
}

.modal h2 { font-size: 22px; margin-bottom: 10px; }
.modal p  { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
.modal a, .modal button.back {
  display: inline-block;
  background: var(--accent);
  color: #000;
  padding: 10px 26px;
  border-radius: 8px;
  font-weight: 700;
  text-decoration: none;
  font-size: 13px;
  border: none;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>

<div class="overlay" id="kicked-overlay">
  <div class="modal">
    <h2>⚠️ You were kicked</h2>
    <p>An admin removed you from the chat room.</p>
    <a href="/">Back to Login</a>
  </div>
</div>

<div class="overlay" id="banned-overlay">
  <div class="modal">
    <h2>🚫 You are banned</h2>
    <p>You have been permanently banned from this server.</p>
    <a href="/">Back to Login</a>
  </div>
</div>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-box">⚡</div>
    <div class="logo-name">TCP<span>Chat</span></div>
  </div>
  <div class="section-label">Online — <span id="online-count">0</span></div>
  <ul id="user-list"></ul>
  <div class="sidebar-footer">
    <div class="my-label">Profile</div>
    <div class="my-nick">{{ nickname }}</div>
  </div>
</aside>

<main class="main">
  <div class="chat-header">
    <div class="chat-title"># general<span>.</span></div>
    <div class="live-pill"><div class="live-dot"></div>live</div>
  </div>

  <div class="dm-banner" id="dm-banner">
    🔒 DM → <strong id="dm-target-name"></strong>
    <button onclick="clearDM()" title="Back to general">✕</button>
  </div>

  <div id="messages"></div>

  <div class="input-row">
    <input id="msg-input" type="text" placeholder="Message #general ..." autocomplete="off"/>
    <button class="send-btn" onclick="sendMsg()">↑</button>
  </div>
</main>

<script>
  const socket = io();
  const ME = "{{ nickname }}";
  let dmTarget = null;

  socket.on('connected', () => {
    socket.emit('get_users');
  });

  socket.on('banned', () => {
    document.getElementById('banned-overlay').classList.add('show');
  });

  socket.on('auth_error', ({ msg }) => {
    window.location.href = '/';
  });

  socket.on('kicked', () => {
    document.getElementById('kicked-overlay').classList.add('show');
  });

  socket.on('server_error', () => {
    addMsg('⚠ Lost connection to server.');
  });

  socket.on('message', ({ msg }) => addMsg(msg));

  socket.on('userlist', ({ users }) => {
    const list  = document.getElementById('user-list');
    const count = document.getElementById('online-count');
    count.textContent = users.length;
    list.innerHTML = '';
    users.forEach(u => {
      const li = document.createElement('li');
      if (u === dmTarget) li.classList.add('dm-active');
      li.innerHTML = `<span class="udot"></span>${u}${u === ME ? '<span class="you-tag">you</span>' : ''}`;
      if (u !== ME) {
        li.title = `Click to DM ${u}`;
        li.onclick = () => setDM(u);
      }
      list.appendChild(li);
    });
  });

  function sendMsg() {
    const input = document.getElementById('msg-input');
    const msg = input.value.trim();
    if (!msg) return;
    if (dmTarget) {
      socket.emit('send_dm', { target: dmTarget, msg });
    } else {
      socket.emit('send_message', { msg });
    }
    input.value = '';
  }

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });

  function setDM(user) {
    dmTarget = user;
    document.getElementById('dm-target-name').textContent = user;
    document.getElementById('dm-banner').classList.add('show');
    document.getElementById('msg-input').placeholder = `DM to ${user}...`;
    document.getElementById('msg-input').focus();
    socket.emit('get_users');
  }

  function clearDM() {
    dmTarget = null;
    document.getElementById('dm-banner').classList.remove('show');
    document.getElementById('msg-input').placeholder = 'Message #general ...';
    socket.emit('get_users');
  }

  function addMsg(text) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.classList.add('msg');

    const isOwn   = text.includes(`] ${ME}:`);
    const isDMIn  = text.includes('[DM from');
    const isDMOut = text.includes('[DM to');
    const isNotif = text.includes('joined the chat') || text.includes('has left') ||
                    text.includes('kicked') || text.includes('banned') || text.includes('📢');

    if (isNotif)       div.classList.add('msg-notif');
    else if (isDMIn)   div.classList.add('msg-dm');
    else if (isDMOut)  { div.classList.add('msg-dm'); div.classList.add('sent'); }
    else if (isOwn)    div.classList.add('msg-own');
    else               div.classList.add('msg-other');

    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  setInterval(() => socket.emit('get_users'), 3000);
</script>
</body>
</html>
