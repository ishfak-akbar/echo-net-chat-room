<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoNet</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
      :root {
        --bg: #0a1218;
        --card: #132129;
        --border: #23404f;
        --text: #e0f2f1;
        --muted: #94c4c0;
        --accent-start: #0f766e;
        --accent-end: #14b8a6;
        --online: #34d399;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        padding: 16px;
        display: flex;
        gap: 16px;
        overflow: hidden;
      }

      .card {
        background: var(--card);
        border-radius: 20px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Left Sidebar */
      .sidebar {
        width: 300px;
        flex-shrink: 0;
      }

      .sidebar-header {
        padding: 20px 22px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .logo-box {
        width: 38px;
        height: 38px;
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        color: white;
        font-weight: 700;
      }

      .logo-name {
        font-size: 23.5px;
        font-weight: 700;
      }

      .tabs {
        display: flex;
        padding: 10px 18px;
        gap: 8px;
        border-bottom: 1px solid var(--border);
      }

      .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .tab.active {
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        color: white;
      }

      .list-container {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px;
      }

      .user-item,
      .group-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: 14px;
        margin-bottom: 4px;
        cursor: pointer;
      }

      .user-item:hover,
      .group-item:hover {
        background: rgba(20, 184, 166, 0.12);
      }

      .user-item.active,
      .group-item.active {
        background: rgba(20, 184, 166, 0.22);
        border: 1px solid var(--accent-end);
      }

      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        color: white;
        font-weight: 600;
        flex-shrink: 0;
      }

      .user-info {
        flex: 1;
        min-width: 0;
      }
      .user-name {
        font-weight: 600;
        font-size: 15px;
      }
      .last-msg {
        font-size: 12.8px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .unread-badge {
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        color: white;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 9999px;
      }

      /* Global Chat Link */
      .global-link {
        padding: 19px 16px;
        border-top: 1px solid var(--border);
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: 0.2s;
      }

      .global-link:hover {
        background: rgba(20, 184, 166, 0.15);
      }
      .global-link.active {
        border-color: var(--accent-end);
        background: rgba(20, 184, 166, 0.2);
      }

      /* Main Chat */
      .main-chat {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .chat-header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .chat-title {
        font-size: 18px;
        font-weight: 600;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        background: #0a1218;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg {
        max-width: 72%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 15.2px;
        line-height: 1.55;
      }

      .msg-recv {
        background: #1e2f3a;
        align-self: flex-start;
        border-bottom-left-radius: 6px;
      }

      .msg-sent {
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 6px;
      }

      .msg-global {
        background: #1e2f3a;
        border: 1px solid #2a4a5a;
        align-self: flex-start;
        border-bottom-left-radius: 6px;
      }

      .msg-global-mine {
        background: linear-gradient(135deg, #1e3a4a, #2a5a6e);
        align-self: flex-end;
        border-bottom-right-radius: 6px;
      }

      .msg-sender {
        font-size: 13px;
        color: #67e8e0;
        margin-bottom: 4px;
        font-weight: 500;
      }

      .msg-footer {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
      }

      .input-row {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 12px;
      }

      #msg-input {
        flex: 1;
        background: #1e2f3a;
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 14px 22px;
        color: var(--text);
        font-size: 15px;
        outline: none;
      }

      .send-btn {
        width: 48px;
        height: 48px;
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 22px;
        cursor: pointer;
      }

      /* Right Sidebar */
      .right-sidebar {
        width: 290px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .profile-card {
        padding: 24px 20px;
        text-align: center;
      }

      .profile-avatar {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        margin: 0 auto 14px;
        background: linear-gradient(
          135deg,
          var(--accent-start),
          var(--accent-end)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
      }

      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        gap: 12px;
        text-align: center;
      }

      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .overlay.show {
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- Left Sidebar -->
    <div class="card sidebar">
      <div class="sidebar-header">
        <div class="logo-box">⚡</div>
        <div class="logo-name">Echo<span>Net</span></div>
      </div>

      <div class="tabs">
        <div class="tab active" id="tab-online" onclick="showOnline()">
          Online
        </div>
        <div class="tab" id="tab-all" onclick="showAll()">All</div>
        <div class="tab" id="tab-groups" onclick="showGroups()">Groups</div>
      </div>
      <div style="padding: 8px 12px; position: relative">
        <input
          id="search-input"
          type="text"
          placeholder="🔍 Search users..."
          oninput="onSearch()"
          style="
            width: 100%;
            padding: 9px 36px 9px 14px;
            background: #1e2f3a;
            border: 1px solid var(--border);
            border-radius: 15px;
            color: var(--text);
            font-size: 13.5px;
            outline: none;
            font-family: Poppins, sans-serif;
          "
        />
        <span
          id="search-clear"
          onclick="clearSearch()"
          style="
            display: none;
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--muted);
            font-size: 16px;
            line-height: 1;
          "
          >✕</span
        >
      </div>
      <div class="list-container" id="search-list" style="display:none; flex:1;"></div>

      <div class="list-container" id="user-list"></div>
      <div
        class="list-container"
        id="all-user-list"
        style="display: none"
      ></div>

      <div id="groups-section" class="list-container" style="display: none">
        <div
          style="
            padding: 12px 18px;
            font-weight: 600;
            color: var(--muted);
            font-size: 13.5px;
          "
        >
          GROUPS
          <button
            onclick="openGroupModal()"
            style="
              float: right;
              background: linear-gradient(
                135deg,
                var(--accent-start),
                var(--accent-end)
              );
              border: none;
              padding: 5px 11px;
              border-radius: 8px;
              color: white;
              font-size: 12.5px;
            "
          >
            + New
          </button>
        </div>
        <div id="group-list"></div>
      </div>

      <div class="global-link" id="global-btn" onclick="openGlobal()">
        🌐 Global Chat
      </div>

      <div style="padding: 18px 20px; border-top: 1px solid var(--border)">
        <div style="display: flex; align-items: center; gap: 12px">
          <div
            class="avatar"
            style="width: 40px; height: 40px; font-size: 18px"
          >
            {{ nickname[0].upper() if nickname else 'U' }}
          </div>
          <div>
            <div style="font-weight: 600">{{ nickname }}</div>
            <div style="font-size: 12.5px; color: var(--online)">● Online</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Chat -->
    <div class="card main-chat">
      <div class="chat-header">
        <div class="chat-title" id="chat-title">Select a conversation</div>
      </div>

      <div class="empty-state" id="empty-state">
        <div style="font-size: 58px; opacity: 0.5">💬</div>
        <p>Select a user, group or global chat to start messaging</p>
      </div>

      <div id="messages" style="display: none"></div>

      <div class="input-row">
        <input
          id="msg-input"
          type="text"
          placeholder="Type a message..."
          autocomplete="off"
          disabled
        />
        <button class="send-btn" onclick="sendMsg()" disabled>↑</button>
      </div>
    </div>

    <!-- Right Sidebar - Shows selected user info -->
    <div class="card right-sidebar">
      <div class="card profile-card" id="right-profile">
        <div class="profile-avatar" id="right-avatar" style="font-size: 35px">
          👤
        </div>
        <h3 id="right-name" style="margin: 8px 0 6px; font-size: 17.5px">
          Select Chat
        </h3>
        <p id="right-status" style="color: var(--muted); font-size: 13.5px">
          —
        </p>
      </div>

      <div class="card" style="flex: 1; padding: 20px">
        <h4 style="margin-bottom: 16px; color: var(--muted); font-size: 14px">
          Shared Media
        </h4>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            opacity: 0.75;
          "
        >
          <div
            style="background: #1e2f3a; height: 72px; border-radius: 12px"
          ></div>
          <div
            style="background: #1e2f3a; height: 72px; border-radius: 12px"
          ></div>
          <div
            style="background: #1e2f3a; height: 72px; border-radius: 12px"
          ></div>
        </div>
        <p
          style="
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
            font-size: 13px;
          "
        >
          No media shared yet
        </p>
      </div>
    </div>

    <!-- Group Modal -->
    <div class="overlay" id="group-overlay">
      <div class="card" style="width: 380px; padding: 28px">
        <h3 style="margin-bottom: 18px">Create New Group</h3>
        <input
          id="g-name"
          type="text"
          placeholder="Group name"
          style="
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #1e2f3a;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
          "
        />
        <div
          id="member-list"
          style="max-height: 190px; overflow-y: auto; margin-bottom: 20px"
        ></div>
        <div style="display: flex; gap: 12px">
          <button
            onclick="closeGroupModal()"
            style="
              flex: 1;
              padding: 11px;
              background: #23404f;
              border: none;
              border-radius: 12px;
              color: var(--text);
            "
          >
            Cancel
          </button>
          <button
            onclick="submitCreateGroup()"
            style="
              flex: 1;
              padding: 11px;
              background: linear-gradient(
                135deg,
                var(--accent-start),
                var(--accent-end)
              );
              border: none;
              border-radius: 12px;
              color: white;
            "
          >
            Create
          </button>
        </div>
      </div>
    </div>

    <script>
      const socket = io();
      const ME = "{{ nickname }}";

      let mode = null;
      let dmTarget = null;
      let groupTarget = null;

      const conversations = {};
      const groupConversations = {};
      const globalConversation = [];

      let onlineUsersList = [];
      let allUsersList = [];
      let unreadCounts = {};
      let myGroups = {};

      socket.on("online_users", ({ users }) => {
        onlineUsersList = users.filter((u) => u && u !== ME);
        if (document.getElementById("user-list").style.display !== "none") {
          renderUserList("user-list", onlineUsersList);
        }
      });

      socket.on("all_users", ({ users }) => {
        allUsersList = users.filter((u) => u && u !== ME);
        if (document.getElementById("all-user-list").style.display !== "none") {
          renderUserList("all-user-list", allUsersList);
        }
      });

      socket.on("unread_counts", ({ counts }) => {
        unreadCounts = counts || {};
        renderUserList("user-list", onlineUsersList);
        renderUserList("all-user-list", allUsersList);
      });

      socket.on("read_receipt", ({ sender }) => {
        if (conversations[sender]) {
          conversations[sender].forEach((m) => {
            if (m.mine) m.read = true;
          });
        }
        if (mode === "dm" && dmTarget === sender) refreshCurrentChat();
      });

      socket.on("dm", ({ sender, msg, time }) => {
        if (sender === ME) return;
        if (!conversations[sender]) conversations[sender] = [];
        conversations[sender].push({
          sender,
          msg,
          time,
          mine: false,
          read: false,
        });
        updateChatPreview(sender, msg, time);
        if (mode === "dm" && dmTarget === sender)
          renderMsg({ sender, msg, time, mine: false });
      });

      socket.on("dm_sent", ({ target, msg, time }) => {
        updateChatPreview(target, msg, time);
      });

      socket.on("global_msg", ({ sender, msg, time }) => {
        const mine = sender.toLowerCase() === ME.toLowerCase();
        globalConversation.push({ sender, msg, time, mine });
        if (mode === "global")
          renderMsg({ sender, msg, time, mine, isGlobal: true });
      });

      socket.on("gmsg", ({ group, sender, msg, time }) => {
        if (!groupConversations[group]) groupConversations[group] = [];
        const mine = sender === ME;
        groupConversations[group].push({ sender, msg, time, mine });
        if (mode === "group" && groupTarget === group)
          renderMsg({ sender, msg, time, mine, isGroup: true });
      });

      socket.on("chat_history", ({ msgs }) => {
        if (!dmTarget) return;
        conversations[dmTarget] = msgs.map(([s, r, msg, time]) => ({
          sender: s,
          msg,
          time,
          mine: s === ME,
          read: s === ME,
        }));
        if (mode === "dm" && dmTarget) refreshCurrentChat();
      });

      socket.on("group_history", ({ msgs }) => {
        if (!groupTarget) return;
        groupConversations[groupTarget] = msgs.map(([s, msg, time]) => ({
          sender: s,
          msg,
          time,
          mine: s === ME,
        }));
        if (mode === "group" && groupTarget) refreshCurrentChat();
      });

      socket.on("load_global", ({ msgs }) => {
        globalConversation.length = 0;
        msgs.forEach(([sender, msg, time]) =>
          globalConversation.push({ sender, msg, time, mine: sender === ME }),
        );
        if (mode === "global") refreshCurrentChat();
      });

      socket.on("grouplist", ({ groups }) => {
        myGroups = groups;
        renderGroupList();
      });

      socket.on("userlist", ({ users }) => {
        if (
          document.getElementById("group-overlay").classList.contains("show")
        ) {
          renderMemberChecklist(users.filter((u) => u && u !== ME));
        }
      });

      function renderUserList(listId, users) {
        const container = document.getElementById(listId);
        container.innerHTML = "";

        users.forEach((u) => {
          const unread = unreadCounts[u] || 0;
          const last = conversations[u]?.slice(-1)[0] || {};

          const div = document.createElement("div");
          div.className = "user-item";
          div.id = `${listId}-${u}`;
          div.innerHTML = `
          <div class="avatar">${u[0].toUpperCase()}</div>
          <div class="user-info">
            <div class="user-name">${u}</div>
            <div class="last-msg">${last.msg || "No messages yet"}</div>
          </div>
          ${unread ? `<span class="unread-badge">${unread}</span>` : ""}
        `;
          div.onclick = () => openDM(u);
          container.appendChild(div);
        });
      }

      function renderGroupList() {
        const container = document.getElementById("group-list");
        container.innerHTML = "";
        Object.keys(myGroups).forEach((gname) => {
          if (!myGroups[gname].includes(ME)) return;
          const div = document.createElement("div");
          div.className = "group-item user-item";
          div.id = `group-${gname}`;
          div.innerHTML = `
          <div class="avatar" style="background:#3b82f6">G</div>
          <div class="user-info"><div class="user-name">${gname}</div></div>
        `;
          div.onclick = () => openGroup(gname);
          container.appendChild(div);
        });
      }

      function renderMemberChecklist(users) {
        const box = document.getElementById("member-list");
        box.innerHTML = "";
        users.forEach((u) => {
          const div = document.createElement("div");
          div.style.padding = "8px 12px";
          div.innerHTML = `<input type="checkbox" value="${u}"> ${u}`;
          box.appendChild(div);
        });
      }

      function refreshCurrentChat() {
        const box = document.getElementById("messages");
        box.innerHTML = "";

        if (mode === "dm" && dmTarget && conversations[dmTarget]) {
          conversations[dmTarget].forEach((m) => renderMsg(m));
        } else if (
          mode === "group" &&
          groupTarget &&
          groupConversations[groupTarget]
        ) {
          groupConversations[groupTarget].forEach((m) =>
            renderMsg({ ...m, isGroup: true }),
          );
        } else if (mode === "global") {
          globalConversation.forEach((m) =>
            renderMsg({ ...m, isGlobal: true }),
          );
        }
        box.scrollTop = box.scrollHeight;
      }

      function renderMsg({
        sender,
        msg,
        time,
        mine,
        isGlobal = false,
        isGroup = false,
        read = false,
      }) {
        const box = document.getElementById("messages");
        const wrap = document.createElement("div");
        wrap.style.cssText = `display:flex;flex-direction:column;align-items:${mine ? "flex-end" : "flex-start"}; margin:4px 0;`;

        if ((isGlobal || isGroup) && !mine) {
          const s = document.createElement("div");
          s.className = "msg-sender";
          s.textContent = sender;
          wrap.appendChild(s);
        }

        const bubble = document.createElement("div");
        let cls = mine ? "msg-sent" : "msg-recv";
        if (isGlobal) cls = mine ? "msg-global-mine" : "msg-global";
        bubble.className = `msg ${cls}`;
        bubble.textContent = msg;

        const footer = document.createElement("div");
        footer.className = "msg-footer";
        footer.innerHTML = (time || "").replace(/[\[\]()]/g, "");

        if (mine && !isGlobal && !isGroup) {
          footer.innerHTML += ` <span style="color:${read ? "#4fc8ff" : "var(--muted)"}">${read ? "✓✓" : "✓"}</span>`;
        }

        wrap.appendChild(bubble);
        wrap.appendChild(footer);
        box.appendChild(wrap);
        box.scrollTop = box.scrollHeight;
      }

      function updateChatPreview(user, msg, time) {
        const el =
          document.getElementById(`user-list-${user}`) ||
          document.getElementById(`all-user-list-${user}`);
        if (el) {
          const lastMsgEl = el.querySelector(".last-msg");
          if (lastMsgEl)
            lastMsgEl.textContent =
              msg.length > 35 ? msg.substring(0, 35) + "..." : msg;
        }
      }

      function setActiveNone() {
        document
          .querySelectorAll(".user-item, .group-item")
          .forEach((el) => el.classList.remove("active"));
        document.getElementById("global-btn").classList.remove("active");
      }

      function openDM(user) {
        mode = "dm";
        dmTarget = user;
        groupTarget = null;

        socket.emit("mark_read", { target: user });
        unreadCounts[user] = 0;

        setActiveNone();
        const activeEl =
          document.getElementById(`user-list-${user}`) ||
          document.getElementById(`all-user-list-${user}`);
        if (activeEl) activeEl.classList.add("active");

        document.getElementById("right-avatar").textContent =
          user[0].toUpperCase();
        document.getElementById("right-name").textContent = user;
        document.getElementById("right-status").innerHTML =
          `● <span style="color:var(--online)">Online</span>`;

        document.getElementById("chat-title").innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="avatar" style="width:42px;height:42px;font-size:18px;">${user[0].toUpperCase()}</div>
          <div><div style="font-weight:600;">${user}</div></div>
        </div>
      `;

        document.getElementById("empty-state").style.display = "none";
        document.getElementById("messages").style.display = "flex";

        const input = document.getElementById("msg-input");
        input.disabled = false;
        input.placeholder = `Message ${user}...`;
        document.querySelector(".send-btn").disabled = false;

        socket.emit("load_chat", { target: user });
        refreshCurrentChat();
      }

      function openGlobal() {
        mode = "global";
        dmTarget = null;
        groupTarget = null;

        setActiveNone();
        document.getElementById("global-btn").classList.add("active");

        document.getElementById("chat-title").innerHTML =
          `🌐 <span style="color:#67e8e0">Global Chat</span>`;

        document.getElementById("right-avatar").textContent = "🌐";
        document.getElementById("right-name").textContent = "Global Chat";
        document.getElementById("right-status").textContent = "Everyone";

        document.getElementById("empty-state").style.display = "none";
        document.getElementById("messages").style.display = "flex";

        const input = document.getElementById("msg-input");
        input.disabled = false;
        input.placeholder = "Message everyone...";
        document.querySelector(".send-btn").disabled = false;

        socket.emit("load_global", {});
        refreshCurrentChat();
      }

      function openGroup(gname) {
        mode = "group";
        groupTarget = gname;
        dmTarget = null;

        setActiveNone();
        const li = document.getElementById(`group-${gname}`);
        if (li) li.classList.add("active");

        document.getElementById("chat-title").innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="avatar" style="background:#3b82f6">G</div>
          <div style="font-weight:600;">#${gname}</div>
        </div>
      `;

        document.getElementById("right-avatar").textContent = "G";
        document.getElementById("right-name").textContent = gname;
        document.getElementById("right-status").textContent = "Group";

        document.getElementById("empty-state").style.display = "none";
        document.getElementById("messages").style.display = "flex";

        const input = document.getElementById("msg-input");
        input.disabled = false;
        input.placeholder = `Message #${gname}...`;
        document.querySelector(".send-btn").disabled = false;

        socket.emit("load_group_history", { group: gname });
        refreshCurrentChat();
      }

      function sendMsg() {
        const input = document.getElementById("msg-input");
        const msg = input.value.trim();
        if (!msg) return;

        const time = new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });

        if (mode === "dm" && dmTarget) {
          if (!conversations[dmTarget]) conversations[dmTarget] = [];
          conversations[dmTarget].push({
            sender: ME,
            msg,
            time,
            mine: true,
            read: false,
          });
          renderMsg({ msg, time, mine: true, read: false });
          socket.emit("send_dm", { target: dmTarget, msg });
        } else if (mode === "global") {
          socket.emit("send_global", { msg });
        } else if (mode === "group" && groupTarget) {
          socket.emit("send_gmsg", { group: groupTarget, msg });
        }

        input.value = "";
      }

      function showOnline() {
        /* same as before */
        document.getElementById("user-list").style.display = "block";
        document.getElementById("all-user-list").style.display = "none";
        document.getElementById("groups-section").style.display = "none";
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById("tab-online").classList.add("active");
      }

      function showAll() {
        document.getElementById("user-list").style.display = "none";
        document.getElementById("all-user-list").style.display = "block";
        document.getElementById("groups-section").style.display = "none";
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById("tab-all").classList.add("active");
      }

      function showGroups() {
        document.getElementById("user-list").style.display = "none";
        document.getElementById("all-user-list").style.display = "none";
        document.getElementById("groups-section").style.display = "block";
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById("tab-groups").classList.add("active");
      }

      function openGroupModal() {
        document.getElementById("group-overlay").classList.add("show");
        renderMemberChecklist(allUsersList);
      }

      function closeGroupModal() {
        document.getElementById("group-overlay").classList.remove("show");
      }

      function submitCreateGroup() {
        const name = document.getElementById("g-name").value.trim();
        const checked = Array.from(
          document.querySelectorAll("#member-list input:checked"),
        ).map((cb) => cb.value);
        if (!name) return alert("Group name required");
        if (checked.length === 0) return alert("Select at least one member");
        socket.emit("create_group", { name, members: checked });
        closeGroupModal();
      }

      function onSearch() {
        const q = document
          .getElementById("search-input")
          .value.trim()
          .toLowerCase();
        document.getElementById("search-clear").style.display = q
          ? "block"
          : "none";

        if (!q) {
          document.getElementById("search-list").style.display = "none";
          restoreActiveTab();
          return;
        }

        document.getElementById("user-list").style.display = "none";
        document.getElementById("all-user-list").style.display = "none";
        document.getElementById("groups-section").style.display = "none";

        const combined = [...new Set([...onlineUsersList, ...allUsersList])];
        const results = combined.filter((u) => u.toLowerCase().startsWith(q));
        const box = document.getElementById("search-list");
        box.innerHTML = "";
        box.style.display = "block";

        if (results.length === 0) {
          box.innerHTML = `<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px;">No users found</div>`;
          return;
        }

        results.forEach((u) => {
          const div = document.createElement("div");
          div.className = "user-item";
          div.innerHTML = `
          <div class="avatar">${u[0].toUpperCase()}</div>
          <div class="user-info">
            <div class="user-name">${u}</div>
            <div class="last-msg">${conversations[u]?.slice(-1)[0]?.msg || "No messages yet"}</div>
          </div>`;
          div.onclick = () => {
            openDM(u);
          };
          box.appendChild(div);
        });
      }

      function clearSearch() {
        const input = document.getElementById("search-input");
        input.value = "";
        document.getElementById("search-clear").style.display = "none";
        document.getElementById("search-list").style.display = "none";
        restoreActiveTab();
      }

      function restoreActiveTab() {
        const activeTab = document.querySelector(".tab.active")?.id;
        if (activeTab === "tab-all") showAll();
        else if (activeTab === "tab-groups") showGroups();
        else showOnline();
      }

      document.getElementById("msg-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMsg();
      });

      socket.emit("get_users");
      socket.emit("get_unread");

      setInterval(() => {
        socket.emit("get_users");
        socket.emit("get_unread");
      }, 5000);

      showOnline();
    </script>
  </body>
</html>
