<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — TCP Chat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Clash+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #08090a;
        --surface: #111214;
        --surface2: #16181b;
        --border: #1f2023;
        --accent: #4fffb0;
        --danger: #ff6b6b;
        --warn: #ffb347;
        --text: #e2e4e9;
        --muted: #555861;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle, #1f2023 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.5;
        z-index: 0;
        pointer-events: none;
      }

      .header {
        position: relative;
        z-index: 1;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .hicon {
        width: 36px;
        height: 36px;
        background: var(--danger);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 700;
      }
      .header h1 span {
        color: var(--danger);
      }

      .nav-links {
        display: flex;
        gap: 10px;
      }
      .nav-links a {
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 7px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .nav-links a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      .wrap {
        position: relative;
        z-index: 1;
        max-width: 960px;
        margin: 32px auto;
        padding: 0 24px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
      }

      .card-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 7px;
      }

      #admin-users {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #admin-users li {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
      }

      .udot {
        width: 7px;
        height: 7px;
        background: var(--accent);
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 5px var(--accent);
      }

      .actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }

      .bkick,
      .bban {
        border: none;
        border-radius: 5px;
        padding: 4px 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }

      .bkick {
        background: rgba(255, 179, 71, 0.12);
        color: var(--warn);
        border: 1px solid rgba(255, 179, 71, 0.25);
      }
      .bban {
        background: rgba(255, 107, 107, 0.12);
        color: var(--danger);
        border: 1px solid rgba(255, 107, 107, 0.25);
      }
      .bkick:hover {
        opacity: 0.75;
      }
      .bban:hover {
        opacity: 0.75;
      }

      .stats {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .stat {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 13px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
      }
      .stat-val {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
      }

      #log {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        height: 200px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
      }

      #log::-webkit-scrollbar {
        width: 3px;
      }
      #log::-webkit-scrollbar-thumb {
        background: var(--border);
      }

      .log-row {
        display: flex;
        gap: 10px;
      }
      .log-t {
        color: var(--accent);
        flex-shrink: 0;
      }
      .log-m {
        color: var(--muted);
      }

      .bc-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      textarea {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 11px 13px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        resize: vertical;
        min-height: 80px;
        outline: none;
        transition: border-color 0.2s;
      }

      textarea:focus {
        border-color: var(--accent);
      }

      .bc-btn {
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }

      .bc-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(79, 255, 176, 0.2);
      }

      .empty {
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <div class="hicon">🛡️</div>
        <h1>Admin <span>Panel</span></h1>
      </div>
      <div class="nav-links">
        <a href="/chat">→ Chat</a>
        <a href="/">Logout</a>
      </div>
    </div>

    <div class="wrap">
      <div class="card">
        <div class="card-title">🟢 Online Users</div>
        <ul id="admin-users">
          <li class="empty">Loading...</li>
        </ul>
      </div>

      <div class="card">
        <div class="card-title">📊 Stats</div>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">online now</span>
            <span class="stat-val" id="s-online">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">actions taken</span>
            <span class="stat-val" id="s-actions">0</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📋 Activity Log</div>
        <div id="log">
          <div class="log-row">
            <span class="log-t">--:--</span
            ><span class="log-m">Waiting for activity...</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">📢 Broadcast</div>
        <div class="bc-form">
          <textarea
            id="bc-msg"
            placeholder="Send a message to all users..."
          ></textarea>
          <button class="bc-btn" onclick="doBroadcast()">
            Send to Everyone
          </button>
        </div>
      </div>
    </div>

    <script>
      const socket = io();
      let actions = 0;

      socket.on("userlist", ({ users }) => {
        const list = document.getElementById("admin-users");
        const online = users.filter((u) => u && u !== "admin");
        document.getElementById("s-online").textContent = online.length;

        if (!online.length) {
          list.innerHTML = '<li class="empty">No users online</li>';
          return;
        }

        list.innerHTML = "";
        online.forEach((u) => {
          const li = document.createElement("li");
          li.innerHTML = `
        <span class="udot"></span>
        <span>${u}</span>
        <div class="actions">
          <button class="bkick" onclick="doKick('${u}')">KICK</button>
          <button class="bban"  onclick="doBan('${u}')">BAN</button>
        </div>`;
          list.appendChild(li);
        });
      });

      socket.on("message", ({ msg }) => log(msg));

      function log(text) {
        const box = document.getElementById("log");
        const now = new Date().toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
        });
        const row = document.createElement("div");
        row.className = "log-row";
        row.innerHTML = `<span class="log-t">${now}</span><span class="log-m">${text}</span>`;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function doKick(name) {
        if (!confirm(`Kick ${name} from the chat?`)) return;
        socket.emit("kick_user", { target: name });
        actions++;
        document.getElementById("s-actions").textContent = actions;
        log(`⚠ Kicked ${name}`);
      }

      function doBan(name) {
        if (!confirm(`Permanently ban ${name}?`)) return;
        socket.emit("ban_user", { target: name });
        actions++;
        document.getElementById("s-actions").textContent = actions;
        log(`🚫 Banned ${name}`);
      }

      function doBroadcast() {
        const msg = document.getElementById("bc-msg").value.trim();
        if (!msg) return;
        socket.emit("broadcast_msg", { msg });
        document.getElementById("bc-msg").value = "";
        log(`📢 Broadcast: ${msg}`);
      }

      socket.emit("get_users");
      setInterval(() => socket.emit("get_users"), 3000);
    </script>
  </body>
</html>
