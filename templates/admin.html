<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel — TCP Chat</title>
    <link
      href__="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Clash+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #010505;
        --surface: #060f0f;
        --surface2: #0a1a1a;
        --border: rgba(0, 168, 132, 0.15);
        --text: #e6e8ec;
        --muted: #8b949e;
        --accent: #00a884;
        --accent2: #0ea5e9;
        --online: #22c55e;
        --offline: #6b7280;
        --danger: #ff6b6b;
        --warn: #ffb347;
      }
      body {
        background: linear-gradient(160deg, #0a2a2a 0%, #051515 100%);
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle, #0a2a2a 1px, transparent 1px);
        background-size: 28px 28px;
        opacity: 0.5;
        z-index: 0;
        pointer-events: none;
      }
      .header {
        position: relative;
        z-index: 1;
        background: linear-gradient(
          160deg,
          #0a1a1a 0%,
          #050d0d 50%,
          #020808 100%
        );
        border-bottom: 1px solid rgba(0, 168, 132, 0.2);
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hicon {
        width: 36px;
        height: 36px;
        border: 1px solid var(--accent);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
      }
      .header h1 {
        font-size: 22px;
        font-weight: 700;
      }
      .header h1 span {
        color: var(--accent);
      }
      .nav-links {
        display: flex;
        gap: 10px;
      }
      .nav-links a {
        font-size: 16px;
        color: var(--muted);
        text-decoration: none;
        padding: 6px 14px;
        border: 1px solid rgba(0, 168, 132, 0.2);
        border-radius: 7px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .nav-links a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 960px;
        margin: 22px auto;
        padding: 0 24px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "users stats"
          "bans log"
          "broadcast broadcast";
        gap: 20px;
      }
      .card:nth-child(1) {
        grid-area: users;
      }
      .card:nth-child(2) {
        grid-area: stats;
      }
      .card:nth-child(3) {
        grid-area: bans;
      }
      .card:nth-child(4) {
        grid-area: log;
      }
      .card-broadcast {
        grid-area: broadcast;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 24px;
      }
      .card-broadcast {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        padding: 24px;
      }
      .card-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #admin-users {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-height: 320px;
        overflow-y: auto;
      }
      #admin-users li {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
        background: linear-gradient(135deg, #0a2a2a 0%, #0a1a2a 100%);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        font-size: 17px;
      }
      #ban-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-height: 320px;
        overflow-y: auto;
      }
      #ban-list li {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 12px;
        background: linear-gradient(135deg, #0a2a2a 0%, #0a1a2a 100%);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        font-size: 17px;
      }
      .udot {
        width: 7px;
        height: 7px;
        background: var(--accent);
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 5px var(--accent);
      }
      .actions {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .bkick,
      .bban,
      .bunban {
        border: none;
        border-radius: 5px;
        padding: 4px 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .bkick {
        background: rgba(255, 179, 71, 0.12);
        color: var(--warn);
        border: 1px solid rgba(255, 179, 71, 0.25);
      }
      .bban {
        background: rgba(255, 107, 107, 0.12);
        color: var(--danger);
        border: 1px solid rgba(255, 107, 107, 0.25);
      }
      .bunban {
        background: rgba(46, 204, 113, 0.12);
        color: #2ecc71;
        border: 1px solid rgba(46, 204, 113, 0.25);
      }
      .bkick:hover,
      .bban:hover,
      .bunban:hover {
        opacity: 0.75;
      }
      .stats {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 13px;
        background: rgba(0, 168, 132, 0.05);
        border: 1px solid rgba(0, 168, 132, 0.15);
        border-radius: 8px;
      }
      .stat-label {
        font-size: 16px;
        color: var(--muted);
      }
      .stat-val {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
      }
      #log {
        background: linear-gradient(
          160deg,
          #060f0f 0%,
          #030808 50%,
          #010505 100%
        );
        border: 1px solid rgba(0, 168, 132, 0.15);
        border-radius: 8px;
        padding: 12px;
        height: 220px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 15px;
      }
      #log::-webkit-scrollbar {
        width: 3px;
      }
      #log::-webkit-scrollbar-thumb {
        background: rgba(0, 168, 132, 0.3);
      }
      .log-row {
        display: flex;
        gap: 10px;
      }
      .log-t {
        color: var(--accent);
        flex-shrink: 0;
      }
      .log-m {
        color: var(--muted);
      }
      .bc-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      textarea {
        background: linear-gradient(160deg, #060f0f 0%, #030808 100%);
        border: 1px solid rgba(0, 168, 132, 0.2);
        border-radius: 8px;
        padding: 11px 13px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        resize: vertical;
        min-height: 80px;
        outline: none;
        transition: border-color 0.2s;
      }
      textarea:focus {
        border-color: var(--accent);
      }
      .bc-btn {
        background: linear-gradient(135deg, #009973 0%, #0d95d4 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .bc-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0, 168, 132, 0.4);
      }
      .empty {
        font-size: 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <div class="hicon">🛡️</div>
        <h1>Admin <span>Panel</span></h1>
      </div>
      <div class="nav-links">
        <a href="/logout">Logout</a>
      </div>
    </div>

    <div class="wrap">
      <div class="card">
        <div class="card-title">🟢 Online Users</div>
        <ul id="admin-users">
          <li class="empty">Loading...</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-title">📊 Stats</div>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">Online now</span>
            <span class="stat-val" id="s-online">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Actions taken</span>
            <span class="stat-val" id="s-actions">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Broadcasts sent</span>
            <span class="stat-val" id="s-bc">0</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🚫 Banned Users</div>
        <ul id="ban-list">
          <li class="empty">Loading...</li>
        </ul>
      </div>

      <div class="card">
        <div class="card-title">📋 Activity Log</div>
        <div id="log">
          <div class="log-row">
            <span class="log-t">--:--</span
            ><span class="log-m">Waiting for activity...</span>
          </div>
        </div>
      </div>
      <div class="card-broadcast">
        <div class="card-title">📢 Broadcast to All</div>
        <div class="bc-form">
          <textarea
            id="bc-msg"
            placeholder="Send a message to all users..."
          ></textarea>
          <button class="bc-btn" onclick="doBroadcast()">
            Send to Everyone
          </button>
        </div>
      </div>
    </div>

    <script>
      const socket = io();
      let actions = 0;
      let broadcasts = 0;

      socket.on("userlist", ({ users }) => {
        const list = document.getElementById("admin-users");
        const online = users.filter((u) => u && u !== "admin");
        document.getElementById("s-online").textContent = online.length;
        if (!online.length) {
          list.innerHTML = '<li class="empty">No users online</li>';
          return;
        }
        list.innerHTML = "";
        online.forEach((u) => {
          const li = document.createElement("li");
          li.id = `auser-${u}`;
          li.innerHTML = `
            <span class="udot"></span>
            <span>${u}</span>
            <div class="actions">
              <button class="bkick" onclick="doKick('${u}')">KICK</button>
              <button class="bban" onclick="doBan('${u}')">BAN</button>
            </div>`;
          list.appendChild(li);
        });
      });

      socket.on("global_msg", ({ sender, msg }) => {
        if (sender !== "admin") log(`💬 ${sender}: ${msg}`);
      });

      socket.on("banlist", ({ bans }) => {
        const list = document.getElementById("ban-list");
        if (!bans.length) {
          list.innerHTML = '<li class="empty">No banned users</li>';
          return;
        }
        list.innerHTML = "";
        bans.forEach((b) => {
          const li = document.createElement("li");
          li.id = `buser-${b}`;
          li.innerHTML = `<span class="bdot"></span><span>${b}</span>
                <div class="actions">
                    <button class="bunban" onclick="doUnban('${b}')">UNBAN</button>
                </div>`;
          list.appendChild(li);
        });
      });

      function log(text) {
        const box = document.getElementById("log");
        // Remove placeholder
        const placeholder = box.querySelector(".log-m");
        if (
          placeholder &&
          placeholder.textContent === "Waiting for activity..."
        ) {
          box.innerHTML = "";
        }
        const now = new Date().toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
        });
        const row = document.createElement("div");
        row.className = "log-row";
        row.innerHTML = `<span class="log-t">${now}</span><span class="log-m">${text}</span>`;
        box.appendChild(row);
        box.scrollTop = box.scrollHeight;
      }

      function doKick(name) {
        if (!confirm(`Kick ${name} from the chat?`)) return;
        socket.emit("kick_user", { target: name });
        actions++;
        document.getElementById("s-actions").textContent = actions;
        log(`⚠ Kicked ${name}`);
        const li = document.getElementById(`auser-${name}`);
        if (li) li.remove();
        // Update online count
        const current = parseInt(
          document.getElementById("s-online").textContent,
        );
        document.getElementById("s-online").textContent = Math.max(
          0,
          current - 1,
        );
      }

      function doBan(name) {
        if (!confirm(`Permanently ban ${name}?`)) return;
        socket.emit("ban_user", { target: name });
        actions++;
        document.getElementById("s-actions").textContent = actions;
        log(`🚫 Banned ${name}`);
        const li = document.getElementById(`auser-${name}`);
        if (li) li.remove();
        const current = parseInt(
          document.getElementById("s-online").textContent,
        );
        document.getElementById("s-online").textContent = Math.max(
          0,
          current - 1,
        );
      }

      function doUnban(name) {
        if (!confirm(`Unban ${name}?`)) return;
        socket.emit("unban_user", { target: name });
      }

      function doBroadcast() {
        const msg = document.getElementById("bc-msg").value.trim();
        if (!msg) return;
        socket.emit("broadcast_msg", { msg });
        document.getElementById("bc-msg").value = "";
        broadcasts++;
        document.getElementById("s-bc").textContent = broadcasts;
        log(`📢 Broadcast: ${msg}`);
      }

      socket.emit("get_bans");
      setInterval(() => {
        socket.emit("get_users");
        socket.emit("get_bans");
      }, 5000);
    </script>
  </body>
</html>
